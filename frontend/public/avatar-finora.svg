<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#020f07"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffcce0"/>
      <stop offset="100%" stop-color="#f9a8c9"/>
    </radialGradient>
    <radialGradient id="innerEar" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffb3d1"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </radialGradient>
    <radialGradient id="eye" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <radialGradient id="pupil" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1a4a2a"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>
    <radialGradient id="nose" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffb3d1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="eyeglow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- Subtle ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 5"/>

  <!-- ── Left ear ── -->
  <ellipse cx="63" cy="75" rx="20" ry="22" fill="#f9a8c9" filter="url(#shadow)"/>
  <ellipse cx="63" cy="77" rx="11" ry="13" fill="url(#innerEar)"/>

  <!-- ── Right ear ── -->
  <ellipse cx="137" cy="75" rx="20" ry="22" fill="#f9a8c9" filter="url(#shadow)"/>
  <ellipse cx="137" cy="77" rx="11" ry="13" fill="url(#innerEar)"/>

  <!-- ── Head ── -->
  <ellipse cx="100" cy="113" rx="55" ry="50" fill="url(#skin)" filter="url(#shadow)"/>

  <!-- ── Left eye white ── -->
  <ellipse cx="81" cy="103" rx="15" ry="16" fill="url(#eye)"/>
  <!-- Left pupil -->
  <ellipse cx="82" cy="104" rx="9" ry="10" fill="url(#pupil)"/>
  <!-- Left iris green ring -->
  <ellipse cx="82" cy="104" rx="9" ry="10" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#eyeglow)" opacity="0.8"/>
  <!-- Left shine -->
  <ellipse cx="77" cy="99" rx="3.5" ry="3.5" fill="white" opacity="0.95"/>
  <ellipse cx="84" cy="108" rx="1.5" ry="1.5" fill="white" opacity="0.5"/>
  <!-- Left eye outline -->
  <ellipse cx="81" cy="103" rx="15" ry="16" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.4"/>

  <!-- ── Right eye white ── -->
  <ellipse cx="119" cy="103" rx="15" ry="16" fill="url(#eye)"/>
  <!-- Right pupil -->
  <ellipse cx="120" cy="104" rx="9" ry="10" fill="url(#pupil)"/>
  <!-- Right iris green ring -->
  <ellipse cx="120" cy="104" rx="9" ry="10" fill="none" stroke="#22c55e" stroke-width="2" filter="url(#eyeglow)" opacity="0.8"/>
  <!-- Right shine -->
  <ellipse cx="115" cy="99" rx="3.5" ry="3.5" fill="white" opacity="0.95"/>
  <ellipse cx="122" cy="108" rx="1.5" ry="1.5" fill="white" opacity="0.5"/>
  <!-- Right eye outline -->
  <ellipse cx="119" cy="103" rx="15" ry="16" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.4"/>

  <!-- ── Eyebrows (cute arched) ── -->
  <path d="M70 90 Q81 84 92 89" fill="none" stroke="#c084a0" stroke-width="3" stroke-linecap="round"/>
  <path d="M108 89 Q119 84 130 90" fill="none" stroke="#c084a0" stroke-width="3" stroke-linecap="round"/>

  <!-- ── Nose ── -->
  <ellipse cx="100" cy="124" rx="14" ry="10" fill="url(#nose)" opacity="0.85"/>
  <!-- Nostrils -->
  <ellipse cx="94.5" cy="125" rx="3.5" ry="3" fill="#be185d" opacity="0.45"/>
  <ellipse cx="105.5" cy="125" rx="3.5" ry="3" fill="#be185d" opacity="0.45"/>

  <!-- ── Smile (big happy) ── -->
  <path d="M85 136 Q100 150 115 136" fill="none" stroke="#be185d" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- ── Cheeks blush ── -->
  <ellipse cx="70" cy="122" rx="12" ry="7" fill="#f43f5e" opacity="0.18"/>
  <ellipse cx="130" cy="122" rx="12" ry="7" fill="#f43f5e" opacity="0.18"/>

  <!-- ── Green sparkles around ── -->
  <!-- Top left -->
  <g opacity="0.7">
    <line x1="30" y1="45" x2="30" y2="55" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="50" x2="35" y2="50" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Top right -->
  <g opacity="0.5">
    <line x1="165" y1="38" x2="165" y2="46" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="161" y1="42" x2="169" y2="42" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- Bottom left -->
  <g opacity="0.4">
    <line x1="38" y1="155" x2="38" y2="161" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="35" y1="158" x2="41" y2="158" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Bottom right sparkle dot -->
  <circle cx="162" cy="160" r="3" fill="#22c55e" opacity="0.5"/>
  <circle cx="162" cy="160" r="5.5" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  <!-- Top center dot -->
  <circle cx="100" cy="22" r="2.5" fill="#22c55e" opacity="0.6"/>
  <!-- Small dots -->
  <circle cx="40" cy="100" r="2" fill="#22c55e" opacity="0.3"/>
  <circle cx="160" cy="100" r="2" fill="#22c55e" opacity="0.3"/>
</svg>
