<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2a1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Skin gradient -->
    <radialGradient id="skinGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#e879a0"/>
    </radialGradient>

    <!-- Ear gradient -->
    <radialGradient id="earGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbb6ce"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </radialGradient>

    <!-- Eye glow green -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>

    <!-- Nose gradient -->
    <radialGradient id="noseGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#e05a8a"/>
    </radialGradient>

    <!-- Outer ring glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Eye inner glow -->
    <filter id="eyeFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Circuit line pattern -->
    <pattern id="circuit" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 H15 M25 20 H40 M20 0 V15 M20 25 V40" stroke="rgba(34,197,94,0.12)" stroke-width="0.8" fill="none"/>
      <circle cx="20" cy="20" r="2.5" fill="none" stroke="rgba(34,197,94,0.15)" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Outer ring background -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>

  <!-- Circuit pattern overlay -->
  <circle cx="100" cy="100" r="100" fill="url(#circuit)"/>

  <!-- Outer neon ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="6 4"/>

  <!-- Inner ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(34,197,94,0.2)" stroke-width="0.8"/>

  <!-- ── Ears ── -->
  <!-- Left ear outer -->
  <ellipse cx="62" cy="72" rx="18" ry="20" fill="url(#earGrad)" opacity="0.95"/>
  <!-- Left ear inner -->
  <ellipse cx="62" cy="74" rx="10" ry="12" fill="#fda4cf" opacity="0.7"/>

  <!-- Right ear outer -->
  <ellipse cx="138" cy="72" rx="18" ry="20" fill="url(#earGrad)" opacity="0.95"/>
  <!-- Right ear inner -->
  <ellipse cx="138" cy="74" rx="10" ry="12" fill="#fda4cf" opacity="0.7"/>

  <!-- ── Head ── -->
  <ellipse cx="100" cy="112" rx="52" ry="48" fill="url(#skinGrad)"/>

  <!-- ── Eyes background (dark) ── -->
  <ellipse cx="82" cy="103" rx="13" ry="14" fill="#0a1628"/>
  <ellipse cx="118" cy="103" rx="13" ry="14" fill="#0a1628"/>

  <!-- ── Eyes neon glow ── -->
  <ellipse cx="82" cy="103" rx="10" ry="11" fill="url(#eyeGlow)" filter="url(#eyeFilter)" opacity="0.9"/>
  <ellipse cx="118" cy="103" rx="10" ry="11" fill="url(#eyeGlow)" filter="url(#eyeFilter)" opacity="0.9"/>

  <!-- Eye pupils -->
  <ellipse cx="83" cy="104" rx="5" ry="6" fill="#052e16"/>
  <ellipse cx="119" cy="104" rx="5" ry="6" fill="#052e16"/>

  <!-- Eye shine highlights -->
  <ellipse cx="85" cy="100" rx="2.5" ry="2.5" fill="white" opacity="0.9"/>
  <ellipse cx="121" cy="100" rx="2.5" ry="2.5" fill="white" opacity="0.9"/>
  <ellipse cx="80" cy="106" rx="1.2" ry="1.2" fill="white" opacity="0.5"/>
  <ellipse cx="116" cy="106" rx="1.2" ry="1.2" fill="white" opacity="0.5"/>

  <!-- Eye neon ring -->
  <ellipse cx="82" cy="103" rx="10" ry="11" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.7"/>
  <ellipse cx="118" cy="103" rx="10" ry="11" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.7"/>

  <!-- ── Nose ── -->
  <ellipse cx="100" cy="124" rx="15" ry="11" fill="url(#noseGrad)" opacity="0.9"/>
  <!-- Nostrils -->
  <ellipse cx="94" cy="125" rx="4" ry="3.5" fill="#9f1239" opacity="0.5"/>
  <ellipse cx="106" cy="125" rx="4" ry="3.5" fill="#9f1239" opacity="0.5"/>

  <!-- ── Smile ── -->
  <path d="M87 136 Q100 147 113 136" fill="none" stroke="#9f1239" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- ── Cheek blush ── -->
  <ellipse cx="73" cy="120" rx="10" ry="6" fill="#f43f5e" opacity="0.2"/>
  <ellipse cx="127" cy="120" rx="10" ry="6" fill="#f43f5e" opacity="0.2"/>

  <!-- ── Tech details: circuit lines on forehead ── -->
  <line x1="78" y1="88" x2="88" y2="88" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <line x1="83" y1="84" x2="83" y2="88" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <circle cx="78" cy="88" r="1.5" fill="#22c55e" opacity="0.5"/>

  <line x1="112" y1="88" x2="122" y2="88" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <line x1="117" y1="84" x2="117" y2="88" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <circle cx="122" cy="88" r="1.5" fill="#22c55e" opacity="0.5"/>

  <!-- Top center circuit dot -->
  <circle cx="100" cy="82" r="2" fill="#22c55e" opacity="0.6"/>
  <line x1="100" y1="82" x2="100" y2="90" stroke="#22c55e" stroke-width="0.8" opacity="0.3"/>

  <!-- ── Outer glow dots (corner) ── -->
  <circle cx="26" cy="100" r="2.5" fill="#22c55e" opacity="0.4"/>
  <circle cx="174" cy="100" r="2.5" fill="#22c55e" opacity="0.4"/>
  <circle cx="100" cy="26" r="2.5" fill="#22c55e" opacity="0.4"/>
  <circle cx="100" cy="174" r="2.5" fill="#22c55e" opacity="0.4"/>
</svg>
