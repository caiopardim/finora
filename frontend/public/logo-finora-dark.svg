<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <filter id="shadowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22c55e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Círculo verde -->
  <circle cx="30" cy="30" r="28" fill="#22c55e" filter="url(#shadowD)"/>

  <!-- Letra F centralizada -->
  <text
    x="30"
    y="40"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="32"
    font-weight="800"
    fill="white"
    text-anchor="middle"
  >F</text>

  <!-- Texto "Finora" em branco -->
  <text
    x="72"
    y="39"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="26"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#ffffff"
  >Finora</text>
</svg>
