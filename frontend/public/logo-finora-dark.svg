<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" fill="none">
  <defs>
    <linearGradient id="goldD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D06A"/>
      <stop offset="45%" stop-color="#D4A83A"/>
      <stop offset="100%" stop-color="#F0C84A"/>
    </linearGradient>
    <linearGradient id="greenBgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4030"/>
      <stop offset="100%" stop-color="#0f2518"/>
    </linearGradient>
  </defs>

  <!-- Star above pig -->
  <path d="M45 5 L46.6 10 L52 10 L47.7 13.1 L49.3 18 L45 14.9 L40.7 18 L42.3 13.1 L38 10 L43.4 10 Z" fill="url(#goldD)"/>

  <!-- Left ear -->
  <path d="M24 36 Q17 20 27 18 Q35 17 36 30 Z" fill="url(#greenBgD)" stroke="url(#goldD)" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Right ear -->
  <path d="M66 36 Q73 20 63 18 Q55 17 54 30 Z" fill="url(#greenBgD)" stroke="url(#goldD)" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Head -->
  <circle cx="45" cy="56" r="34" fill="url(#greenBgD)" stroke="url(#goldD)" stroke-width="3.2"/>

  <!-- Nose ring -->
  <circle cx="45" cy="61" r="13" fill="none" stroke="url(#goldD)" stroke-width="2.5"/>

  <!-- Nostrils -->
  <rect x="39.5" y="57.5" width="4" height="7" rx="2" fill="url(#goldD)"/>
  <rect x="45.5" y="57.5" width="4" height="7" rx="2" fill="url(#goldD)"/>

  <!-- FINORA -->
  <text x="96" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" letter-spacing="7" fill="#ffffff">FINORA</text>

  <!-- Tagline -->
  <text x="97" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="2.5" fill="rgba(255,255,255,0.55)">SUA VIDA FINANCEIRA, </text>
  <text x="270" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="10" letter-spacing="2.5" fill="url(#goldD)">INTELIGENTE.</text>
</svg>
