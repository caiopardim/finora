<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="iconGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#22c55e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ícone -->
  <rect x="0" y="4" width="52" height="52" rx="14" fill="url(#iconGradD)" filter="url(#shadowD)"/>

  <!-- Barras -->
  <rect x="10" y="34" width="8" height="14" rx="3" fill="white" opacity="0.5"/>
  <rect x="22" y="26" width="8" height="22" rx="3" fill="white" opacity="0.75"/>
  <rect x="34" y="16" width="8" height="32" rx="3" fill="white"/>

  <!-- Seta de tendência -->
  <polyline points="10,32 22,24 34,14 44,10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <circle cx="44" cy="10" r="3" fill="white"/>

  <!-- Texto branco para fundo escuro -->
  <text
    x="66"
    y="40"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#ffffff"
  >Finora</text>
</svg>
